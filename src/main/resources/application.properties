spring.application.name=game
server.port=${PORT:8080}

# --- Metrics: push to Grafana Cloud over OTLP ---
# Off unless OTLP_METRICS_ENABLED=true. In Grafana Cloud, open your stack > OpenTelemetry > Configure:
#   OTLP_METRICS_URL = <OTLP endpoint>/v1/metrics  (e.g. https://otlp-gateway-prod-us-east-0.grafana.net/otlp/v1/metrics)
#   OTLP_AUTH_HEADER = Basic <base64 of instanceId:apiToken>
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.headers.Authorization=${OTLP_AUTH_HEADER:}
management.otlp.metrics.export.resource-attributes.service.name=nowhere-backend
management.otlp.metrics.export.resource-attributes.deployment.environment=${DEPLOY_ENV:dev}

# A few fixed histogram buckets instead of full percentile histograms keeps the series count
# well under the Grafana Cloud free tier while still allowing p50/p95/p99 queries across instances.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s,10s
management.metrics.distribution.slo.firestore.dao=25ms,50ms,100ms,250ms,500ms,1s,2s,5s

# --- Tracing: push spans to Grafana Cloud (Tempo) over OTLP ---
# Off unless OTLP_TRACING_ENABLED=true. Same Grafana Cloud endpoint and auth as metrics, but the /v1/traces path:
#   OTLP_TRACES_URL = <OTLP endpoint>/v1/traces
management.tracing.enabled=${OTLP_TRACING_ENABLED:false}
management.otlp.tracing.endpoint=${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
management.otlp.tracing.headers.Authorization=${OTLP_AUTH_HEADER:}
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
# Cloud Run's front end adds its own W3C traceparent header, often marked "not sampled". Honoring it
# would make Boot drop most spans and parent the rest under a Google span Tempo never receives, so
# incoming W3C context is ignored (only B3, which nothing sends us). Outgoing context stays W3C.
management.tracing.propagation.consume=b3
management.tracing.propagation.produce=w3c
