spring.application.name=game
server.port=${PORT:8080}

gcp.project-id=${GOOGLE_CLOUD_PROJECT:nowhere-af065}

# --- Observability: metrics to Cloud Monitoring, traces to Cloud Trace ---
# Off unless GCP_OBSERVABILITY_ENABLED=true (set it on the Cloud Run service). Both use the service
# account's credentials; it needs roles/monitoring.metricWriter and roles/cloudtrace.agent.

# Metrics show up in Metrics Explorer as custom.googleapis.com/... (e.g. http/server/requests, firestore/dao)
management.stackdriver.metrics.export.enabled=${GCP_OBSERVABILITY_ENABLED:false}
management.stackdriver.metrics.export.project-id=${gcp.project-id}
management.stackdriver.metrics.export.use-semantic-metric-types=true
# Each Cloud Run instance must write its own time series, or concurrent instances collide on the
# same series and Cloud Monitoring rejects the writes. task_id is unique per process for that reason.
management.stackdriver.metrics.export.resource-type=generic_task
management.stackdriver.metrics.export.resource-labels.project_id=${gcp.project-id}
management.stackdriver.metrics.export.resource-labels.location=${GCP_REGION:us-east4}
management.stackdriver.metrics.export.resource-labels.namespace=${K_SERVICE:local}
management.stackdriver.metrics.export.resource-labels.job=${K_REVISION:local}
management.stackdriver.metrics.export.resource-labels.task_id=${random.uuid}

# A few fixed histogram buckets instead of full percentile histograms keeps each timer's
# distribution points small (Cloud Monitoring bills custom metrics by bytes ingested) while still
# allowing p50/p95/p99 across instances.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s,10s
management.metrics.distribution.slo.firestore.dao=25ms,50ms,100ms,250ms,500ms,1s,2s,5s

# Traces: see CloudTraceConfig. Cloud Trace's first 2.5M spans a month are free.
management.tracing.enabled=${GCP_OBSERVABILITY_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
# Cloud Run's front end adds its own W3C traceparent header, often marked "not sampled". Honoring it
# would make Boot drop most spans, so incoming W3C context is ignored (only B3, which nothing sends
# us). Outgoing context stays W3C.
management.tracing.propagation.consume=b3
management.tracing.propagation.produce=w3c
